services:
  dartscore-db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dartscoredb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: Europe/Paris
    volumes:
      - darts_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  dartscore-api:
    build:
      context: ./api
    expose:
      - "3000"
    environment:
      PORT: 3000
      DB_HOST: dartscore-db
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: dartscoredb
      JWT_SECRET: defegrnfdeadeozof
    depends_on:
      - dartscore-db
    restart: unless-stopped

  dartscore-app:
    build:
      context: ./app
      args:
        VITE_API_URL: /api
    expose:
      - "80"
    depends_on:
      - dartscore-api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dartscore-app
      - dartscore-api

volumes:
  darts_data:
