services:
  dartscore-db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dartscoredb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: Europe/Paris
    volumes:
      - darts_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  dartscore-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: dartscoredb
      JWT_SECRET: defegrnfdeadeozof
    depends_on:
      - dartscore-db
    restart: unless-stopped

volumes:
  darts_data:
